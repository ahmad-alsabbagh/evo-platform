[project]
name = "evo-platform"
version = "0.1.0"
description = "Production-grade capability evaluation platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "opentelemetry-api>=1.28,<2.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<1.0",
  "opentelemetry-sdk>=1.28,<2.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "redis>=5.2,<6.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "structlog>=24.4,<26.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
  "bandit>=1.7,<2.0",
  "httpx>=0.27,<1.0",
  "jsonschema>=4.23,<5.0",
  "mypy>=1.13,<2.0",
  "pip-audit>=2.7,<3.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "pytest-json-report>=1.5,<2.0",
  "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evo_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "B", "UP", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=evo_platform --cov-report=term-missing"
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: requires a PostgreSQL service"]
