name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evo
          POSTGRES_PASSWORD: evo
          POSTGRES_DB: evo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evo -d evo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EVO_DATABASE_URL: postgresql+asyncpg://evo:evo@localhost:5432/evo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and tooling
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install "httpx>=0.27,<1.0" "jsonschema>=4.23,<5.0" "mypy>=1.13,<2.0" "pytest>=8.3,<9.0" "pytest-asyncio>=0.24,<1.0" "pytest-cov>=6.0,<7.0" "ruff>=0.8,<1.0"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Tests
        run: pytest
      - name: Validate JSON schemas
        run: python - <<'PY'
import json
from pathlib import Path
for path in Path("schemas").glob("*.json"):
    json.loads(path.read_text())
    print(f"validated JSON: {path}")
PY
