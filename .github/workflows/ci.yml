name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --upgrade pip && pip install .[dev]
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Tests
        run: pytest
      - name: Validate JSON schemas
        run: python - <<'PY'
import json
from pathlib import Path
for path in Path("schemas").glob("*.json"):
    json.loads(path.read_text())
    print(f"validated JSON: {path}")
PY
