name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.5"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evo
          POSTGRES_PASSWORD: evo
          POSTGRES_DB: evo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evo -d evo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EVO_DATABASE_URL: postgresql+asyncpg://evo:evo@localhost:5432/evo
      EVO_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --locked --dev
      - name: Import smoke
        run: uv run python -c "from evo_platform.api.app import app; assert app.title == 'evo-platform'"
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src
      - name: Bandit
        run: uv run bandit -r src -ll
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan
        id: gitleaks
        shell: bash
        run: |
          set +e
          gitleaks git . \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 2
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "No secrets found"
            exit 0
          fi

          if [ "$code" -eq 2 ]; then
            echo "::error::Gitleaks found secrets"
            exit 1
          fi

          echo "::error::Gitleaks execution failed with exit code $code"
          exit "$code"

      - name: Verify Gitleaks report
        if: always()
        shell: bash
        run: |
          test -f gitleaks.sarif || {
            echo "::error::Gitleaks did not produce gitleaks.sarif"
            exit 1
          }

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
      - name: Unit and contract tests
        run: uv run pytest -m "not integration"
      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: PostgreSQL and Redis integration tests
        run: uv run pytest -m integration
      - name: Validate JSON schemas
        run: uv run pytest -q tests/test_schemas.py tests/test_catalog_schemas.py tests/test_evaluation_run_schema.py
