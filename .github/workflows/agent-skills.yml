name: Agent Skills format

on:
  pull_request:
    paths:
      - 'capabilities/skills/**'
      - 'tools/validate_skills.py'
      - 'tools/requirements-skills.txt'
      - 'tests/test_agent_skills_format.py'
      - '.github/workflows/agent-skills.yml'
  push:
    branches: [main, feat/foundation]
    paths:
      - 'capabilities/skills/**'
      - 'tools/validate_skills.py'
      - 'tools/requirements-skills.txt'
      - 'tests/test_agent_skills_format.py'
      - '.github/workflows/agent-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-skills.txt
      - run: python tools/validate_skills.py capabilities/skills
      - run: python -m unittest discover -s tests -p test_agent_skills_format.py -v
